[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gitlapse"
version = "0.1.0"
description = "Watch any git repository's history replay live, right in your terminal."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "gitlapse contributors" }]
keywords = ["git", "terminal", "tui", "visualization", "cli", "curses"]
classifiers = [
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/TheDepressedGuy69/gitlapse"
Repository = "https://github.com/TheDepressedGuy69/gitlapse"

[project.scripts]
gitlapse = "gitlapse.cli:main"

[tool.setuptools]
packages = ["gitlapse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
